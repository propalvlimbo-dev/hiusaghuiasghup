plugins {
    // ВАЖНО: для 26.x нужен именно этот id — это плагин-маркер «без ремапа».
    // Старый `fabric-loom` включает ремаппинг и требует конфигурацию `mappings`,
    // которой для 26.x не существует.
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "elytrixclient" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Строки `mappings` здесь быть НЕ должно: в 26.x игра не обфусцирована.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // MP3 декодирование (javax.sound.sampled SPI) — для .mp3 файлов музыки
    implementation 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    include 'com.googlecode.soundlibs:mp3spi:1.9.5.4'

    // Windows Media Session — чтение текущего трека из Spotify, YouTube и т.д.
    implementation('dev.redstones.mediaplayerinfo:media-player-info:0.1.0') { exclude group: 'com.github.hypfvieh' }
    include('dev.redstones.mediaplayerinfo:media-player-info:0.1.0') { transitive = false }

    // ── Зависимости перенесённого визуал-стека delta-26.2 ──
    compileOnly(files("bundled-mods/baritone-fabric-1.15.0-10.jar"))
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.errorprone:error_prone_annotations:2.27.0'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
    implementation 'org.javassist:javassist:3.28.0-GA'
    implementation 'org.json:json:20250107'
    include 'org.json:json:20250107'
    implementation 'org.jsoup:jsoup:1.18.3'
    include 'org.jsoup:jsoup:1.18.3'
    implementation 'org.reflections:reflections:0.10.2'
    implementation 'org.slf4j:slf4j-api:2.0.6'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    if (JavaVersion.current() < JavaVersion.toVersion(targetJavaVersion)) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}