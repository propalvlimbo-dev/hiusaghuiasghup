# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ── ВАЖНО: Loom 1.18 требует Java 25 для самой сборки (и Gradle 9.7+).
# Самый простой способ — IntelliJ: Settings → Build Tools → Gradle → Gradle JVM = 25.
# Если запускаешь из терминала без IDE, раскомментируй строку ниже и укажи свой путь к JDK 25
# (слеши прямые, кавычки не нужны):
#org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-25.0.1+8

# Fabric — маппингов здесь нет и быть не должно: с 26.x не существует ни Yarn,
# ни official Mojang mappings (игра не обфусцирована) — строка `mappings` в build.gradle отсутствует.
minecraft_version=26.2
loader_version=0.19.5
fabric_version=0.161.0+26.2

# Mod
mod_version=0.1.0
maven_group=ru.rooyzee
archives_base_name=elytrixclient
