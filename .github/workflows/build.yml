name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: compile (JDK 25, Gradle 9.7.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      # Ловим ошибки компиляции до того, как их увидит человек: собираем тот же мод,
      # что и локально (Loom 1.18-SNAPSHOT, MC 26.2, без маппингов).
      - name: gradle build
        run: gradle build --no-daemon --stacktrace --console=plain
