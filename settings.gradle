pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

// Автоподкачка toolchain-ов (например, JDK 25), если их нет локально.
// ВАЖНО: сам Gradle-демон всё равно должен быть запущен на Java 25.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'ElytrixClient'