[package]
name = "elytrix-bots"
version = "1.0.0"
edition = "2021"
description = "Elytrix bot daemon: быстрые протокольные боты (Rust) с управлением через HTTP API"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"

[profile.release]
opt-level = 3
lto = true
strip = true
